<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Timetable - Protected Website</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; background-color: #f4f4f4; color: #333; }
        #protected-content { display: none; }
        header { background-color: #24292e; color: #fff; padding: 20px; text-align: center; }
        nav { background: #333; padding: 10px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 800px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        footer { text-align: center; padding: 20px; font-size: 0.8rem; color: #777; }
        
        /* Timetable App Styling */
        .setup-section { background: #eef2f7; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ccc; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        select, input, button { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #218838; }
        .timetable-display { background: #fff; border: 2px solid #24292e; padding: 15px; border-radius: 5px; margin-top: 20px; }
        .day-header { font-size: 1.4rem; color: #24292e; border-bottom: 2px solid #24292e; padding-bottom: 5px; margin-top: 0; }
        .period-item { padding: 8px 0; border-bottom: 1px dashed #eee; }
        .period-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <script>
        // Access Protection Gatekeeper
        if (sessionStorage.getItem('authenticated') !== 'true') {
            var password = prompt("Nuh uh, no unverified people. Enter the Password Here:");
            if (password === "awa, let me in") {
                sessionStorage.setItem('authenticated', 'true');
            } else {
                alert("Incorrect passcode. Access denied.");
                window.location.href = "index.html"; 
            }
        }
        
        // Load the interface once verified
        window.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('authenticated') === 'true') {
                document.getElementById('protected-content').style.display = 'block';
                loadSavedTimetable();
            }
        });

        // Save entry function
        function savePeriod() {
            var day = document.getElementById('day-select').value;
            var period = document.getElementById('period-select').value;
            var subject = document.getElementById('subject-input').value;
            
            if (!subject.trim()) {
                alert("Please enter a subject name.");
                return;
            }

            // Generate a unique data key for storage unique to this browser device
            var storageKey = day + "-" + period;
            localStorage.setItem(storageKey, subject);
            
            // Clear input and refresh view
            document.getElementById('subject-input').value = "";
            loadSavedTimetable();
            alert("Saved successfully!");
        }

        // Render data from device memory
        function loadSavedTimetable() {
            var days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
            var periods = ['Period 1', 'Period 2', 'Period 3', 'Period 4'];
            var outputHtml = "";

            days.forEach(function(day) {
                var dayHasContent = false;
                var dayHtml = "<div class='timetable-display'><h3 class='day-header'>" + day + "</h3>";
                
                periods.forEach(function(period) {
                    var savedSubject = localStorage.getItem(day + "-" + period);
                    if (savedSubject) {
                        dayHasContent = true;
                        dayHtml += "<div class='period-item'><strong>" + period + ":</strong> " + savedSubject + "</div>";
                    }
                });

                if (!dayHasContent) {
                    dayHtml += "<div class='period-item' style='color:#999;'>No classes added for this day yet.</div>";
                }
                
                dayHtml += "</div>";
                outputHtml += dayHtml;
            });

            document.getElementById('timetable-output').innerHTML = outputHtml;
        }
    </script>

    <div id="protected-content">
        <header>
            <h1>My Personalised Portal</h1>
        </header>

    <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="news.html">News</a>
    <a href="timetable.html">Timetable</a>
    <a href="games.html">Games</a> <!-- Add this line -->
</nav>


        <main>
            <h2>Your Custom Schedule Builder</h2>
            <p>Every student using this link will see their own custom schedule. Your data is stored safely right on your own device browser.</p>
            
            <!-- Input Form Box -->
            <div class="setup-section">
                <h3>Add or Update a Class</h3>
                
                <label for="day-select">Select Day:</label>
                <select id="day-select">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                </select>

                <label for="period-select">Select Period:</label>
                <select id="period-select">
                    <option value="Period 1">Period 1</option>
                    <option value="Period 2">Period 2</option>
                    <option value="Period 3">Period 3</option>
                    <option value="Period 4">Period 4</option>
                </select>

                <label for="subject-input">Subject & Room Details:</label>
                <input type="text" id="subject-input" placeholder="e.g., Math - Room 12">

                <br><br>
                <button onclick="savePeriod()">Save to My Device</button>
            </div>

            <h2>My Current Timetable</h2>
            <div id="timetable-output"></div>
        </main>

        <footer>
            <p>&copy; 2026 Protected Website.</p>
        </footer>
    </div>

</body>
</html>
