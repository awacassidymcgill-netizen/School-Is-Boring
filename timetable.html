<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable - School Is Boring</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(26, 26, 36, 0.6);
            --border-color: rgba(40, 167, 69, 0.2);
            --accent-glow: #28a745;
            --accent-hover: #218838;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; line-height: 1.6; }
        #protected-content { display: none; }
        
        header { background: rgba(11, 12, 16, 0.8); backdrop-filter: blur(10px); padding: 30px 20px; text-align: center; border-bottom: 1px solid var(--border-color); }
        header h1 { margin: 0; font-size: 2.5rem; background: linear-gradient(45deg, #28a745, #5cd67a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        
        nav { background: rgba(26, 26, 36, 0.5); backdrop-filter: blur(5px); padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
        nav a { color: var(--text-muted); margin: 0 15px; text-decoration: none; font-weight: 600; padding: 8px 16px; border-radius: 20px; }
        nav a:hover, nav a.active { color: var(--text-main); background: var(--card-bg); box-shadow: 0 0 15px var(--border-color); border: 1px solid var(--border-color); }
        
        main { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        
        .setup-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); margin-bottom: 30px; }
        label { font-weight: 600; display: block; margin-top: 10px; color: var(--text-muted); }
        select, input { width: 100%; padding: 12px; margin-top: 5px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; box-sizing: border-box; font-size: 1rem; }
        select:focus, input:focus { border-color: var(--accent-glow); outline: none; }
        
        .save-btn { background: var(--accent-glow); color: white; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 15px; transition: background 0.2s; }
        .save-btn:hover { background: var(--accent-hover); }
        
        /* Timetable Cards Rendering Grid */
        .timetable-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 30px; }
        .day-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .day-header { font-size: 1.3rem; color: var(--accent-glow); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-top: 0; font-weight: 700; }
        .period-item { padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); font-size: 0.95rem; }
        .period-item:last-child { border-bottom: none; }
        .period-item strong { color: #fff; }
        
        footer { text-align: center; padding: 40px 20px; font-size: 0.9rem; color: var(--text-muted); margin-top: 60px; }
    </style>
</head>
<body>

    <script>
        if (sessionStorage.getItem('authenticated') !== 'true') {
            var password = prompt("Nuh uh, no unverified people. Enter the Password Here:");
            if (password === "awa, let me in") { sessionStorage.setItem('authenticated', 'true'); } 
            else { window.location.href = "index.html"; }
        }
        window.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('authenticated') === 'true') {
                document.getElementById('protected-content').style.display = 'block';
                loadSavedTimetable();
            }
        });

        function savePeriod() {
            var day = document.getElementById('day-select').value;
            var period = document.getElementById('period-select').value;
            var subject = document.getElementById('subject-input').value;
            
            if (!subject.trim()) { alert("Please enter a subject name."); return; }
            localStorage.setItem(day + "-" + period, subject);
            
            document.getElementById('subject-input').value = "";
            loadSavedTimetable();
        }

        function loadSavedTimetable() {
            var days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
            var periods = ['Period 1', 'Period 2', 'Period 3', 'Period 4'];
            var outputHtml = "";

            days.forEach(function(day) {
                var dayHasContent = false;
                var dayHtml = "<div class='day-card'><h3 class='day-header'>" + day + "</h3>";
                
                periods.forEach(function(period) {
                    var savedSubject = localStorage.getItem(day + "-" + period);
                    if (savedSubject) {
                        dayHasContent = true;
                        dayHtml += "<div class='period-item'><strong>" + period + ":</strong> " + savedSubject + "</div>";
                    }
                });

                if (!dayHasContent) {
                    dayHtml += "<div class='period-item' style='color:var(--text-muted); font-style:italic;'>No classes logged.</div>";
                }
                dayHtml += "</div>";
                outputHtml += dayHtml;
            });

            document.getElementById('timetable-output').innerHTML = outputHtml;
        }
    </script>

    <div id="protected-content">
        <header>
            <h1>Personalised Schedule</h1>
        </header>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="news.html">News</a>
            <a href="timetable.html" class="active">Timetable</a>
            <a href="assessments.html">Assessments</a>
            <a href="games.html">Games</a>
        </nav>

        <main>
            <div class="setup-section">
                <h3>Add or Edit Class Nodes</h3>
                
                <label for="day-select">Select Target Day:</label>
                <select id="day-select">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                </select>

                <label for="period-select">Select Shift Metric:</label>
                <select id="period-select">
                    <option value="Period 1">Period 1</option>
                    <option value="Period 2">Period 2</option>
                    <option value="Period 3">Period 3</option>
                    <option value="Period 4">Period 4</option>
                </select>

                <label for="subject-input">Class & Location Parameters:</label>
                <input type="text" id="subject-input" placeholder="e.g., Chemistry - Lab 4">

                <button class="save-btn" onclick="savePeriod()">Commit to Local Storage Device</button>
            </div>

            <h2>Weekly Timetable Layout Matrix</h2>
            <div id="timetable-output" class="timetable-grid"></div>
        </main>

        <footer>
            <p>&copy; 2026 School Is Boring.</p>
        </footer>
    </div>

</body>
</html>
