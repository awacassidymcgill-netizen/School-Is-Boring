<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessments - School Is Boring</title>
    <style>
        :root { --bg-color: #0b0c10; --card-bg: rgba(26, 26, 36, 0.6); --border-color: rgba(40, 167, 69, 0.2); --accent-glow: #28a745; --accent-hover: #218838; --text-main: #ffffff; --text-muted: #a1a1aa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        #protected-content { display: none; }
        header { background: rgba(11, 12, 16, 0.8); backdrop-filter: blur(10px); padding: 30px 20px; text-align: center; border-bottom: 1px solid var(--border-color); }
        header h1 { margin: 0; font-size: 2.5rem; background: linear-gradient(45deg, #28a745, #5cd67a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        nav { background: rgba(26, 26, 36, 0.5); backdrop-filter: blur(5px); padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
        nav a { color: var(--text-muted); margin: 0 15px; text-decoration: none; font-weight: 600; padding: 8px 16px; border-radius: 20px; }
        nav a:hover, nav a.active { color: var(--text-main); background: var(--card-bg); box-shadow: 0 0 15px var(--border-color); border: 1px solid var(--border-color); }
        
        main { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .input-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); margin-bottom: 30px; }
        
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        input, select { flex: 1; min-width: 200px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; color: #fff; font-size: 1rem; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--accent-glow); outline: none; }
        
        .action-btn { background: var(--accent-glow); color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-weight: bold; font-size: 1rem; cursor: pointer; width: 100%; transition: background 0.2s; }
        .action-btn:hover { background: var(--accent-hover); }
        
        /* Assessment Interactive Cards Layout */
        .task-list { display: flex; flex-direction: column; gap: 15px; }
        .task-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s; }
        .task-card:hover { border-color: var(--border-color); box-shadow: 0 4px 15px rgba(40,167,69,0.1); }
        .task-details h3 { margin: 0 0 5px 0; color: #fff; font-size: 1.2rem; }
        .task-details span { font-size: 0.85rem; padding: 4px 8px; border-radius: 12px; font-weight: bold; background: rgba(255,255,255,0.1); color: var(--text-muted); }
        .task-details .badge-high { background: rgba(220,53,69,0.2); color: #dc3545; }
        
        .check-btn { background: rgba(40, 167, 69, 0.1); border: 1px solid var(--accent-glow); color: var(--accent-glow); font-size: 1.2rem; padding: 10px; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: all 0.2s; }
        .check-btn:hover { background: var(--accent-glow); color: #fff; }
        .empty-notice { text-align: center; color: var(--text-muted); padding: 40px; border: 2px dashed rgba(255,255,255,0.05); border-radius: 12px; }
        footer { text-align: center; padding: 40px 20px; font-size: 0.9rem; color: var(--text-muted); margin-top: 60px; }
    </style>
</head>
<body>

    <script>
        if (sessionStorage.getItem('authenticated') !== 'true') {
            var password = prompt("Nuh uh, no unverified people. Enter the Password Here:");
            if (password === "awa, let me in") { sessionStorage.setItem('authenticated', 'true'); } 
            else { alert("Incorrect passcode. Access denied."); window.location.href = "index.html"; }
        }
        window.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('authenticated') === 'true') {
                document.getElementById('protected-content').style.display = 'block';
                loadTasks();
            }
        });

        function saveTask() {
            var name = document.getElementById('task-name').value;
            var subject = document.getElementById('task-subject').value;
            var weight = document.getElementById('task-weight').value;
            
            if (!name.trim()) { alert("Please input a valid task title."); return; }
            
            var taskObject = { id: Date.now(), title: name, subject: subject, weight: weight };
            var existingTasks = JSON.parse(localStorage.getItem('hub_tasks')) || [];
            existingTasks.push(taskObject);
            localStorage.setItem('hub_tasks', JSON.stringify(existingTasks));
            
            document.getElementById('task-name').value = '';
            loadTasks();
        }

        function removeTask(id) {
            var existingTasks = JSON.parse(localStorage.getItem('hub_tasks')) || [];
            var updatedTasks = existingTasks.filter(t => t.id !== id);
            localStorage.setItem('hub_tasks', JSON.stringify(updatedTasks));
            loadTasks();
        }

        function loadTasks() {
            var tasks = JSON.parse(localStorage.getItem('hub_tasks')) || [];
            var container = document.getElementById('tasks-container');
            if (tasks.length === 0) {
                container.innerHTML = `<div class="empty-notice">🎉 Area Clear! No pending criteria items recorded in layout space.</div>`;
                return;
            }
            var output = "";
            tasks.forEach(t => {
                var isHigh = parseInt(t.weight) >= 25 ? 'badge-high' : '';
                output += `
                    <div class="task-card">
                        <div class="task-details">
                            <h3>${t.title}</h3>
                            <span class="${isHigh}">${t.subject} (${t.weight}%)</span>
                        </div>
                        <button class="check-btn" onclick="removeTask(${t.id})">✓</button>
                    </div>`;
            });
            container.innerHTML = output;
        }
    </script>

    <div id="protected-content">
        <header>
            <h1>Assessment Pipeline</h1>
        </header>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="news.html">News</a>
            <a href="timetable.html">Timetable</a>
            <a href="assessments.html" class="active">Assessments</a>
            <a href="games.html">Games</a>
        </nav>

        <main>
            <div class="input-panel">
                <h3>Log New Task Criteria</h3>
                <div class="form-row">
                    <input type="text" id="task-name" placeholder="Assignment Name (e.g. Essay 1)">
                    <input type="text" id="task-subject" placeholder="Subject (e.g. English)">
                    <select id="task-weight">
                        <option value="10">Weight: 10% (Low)</option>
                        <option value="20">Weight: 20% (Medium)</option>
                        <option value="30">Weight: 30% (High)</option>
                        <option value="50">Weight: 50% (Major Exam)</option>
                    </select>
                </div>
                <button class="action-btn" onclick="saveTask()">Inject Assessment Node</button>
            </div>

            <h2>Current Criteria Checklist</h2>
            <div id="tasks-container" class="task-list"></div>
        </main>

        <footer>
            <p>&copy; 2026 School Is Boring.</p>
        </footer>
    </div>

</body>
</html>
